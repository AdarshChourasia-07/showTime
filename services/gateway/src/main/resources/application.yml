server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: catalog
              uri: ${CATALOG_URL:http://localhost:8081}
              predicates:
                - Path=/api/catalog/**
            - id: inventory
              uri: ${INVENTORY_URL:http://localhost:8082}
              predicates:
                - Path=/api/inventory/**
            - id: booking
              uri: ${BOOKING_URL:http://localhost:8083}
              predicates:
                - Path=/api/bookings/**
            - id: payment
              uri: ${PAYMENT_URL:http://localhost:8084}
              predicates:
                - Path=/api/payments/**

showtime:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:4300

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
