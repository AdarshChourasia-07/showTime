# Local infrastructure for ShowTime.
# Services (gateway, catalog, ...) run from IntelliJ; only infra runs here.
#
#   docker compose up -d          start everything below
#   docker compose down           stop (data kept in volumes)
#   docker compose down -v        stop and wipe all data

name: showtime

services:

  postgres:
    image: postgres:18
    container_name: showtime-postgres
    environment:
      POSTGRES_USER: showtime
      POSTGRES_PASSWORD: showtime
      POSTGRES_DB: showtime
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showtime -d showtime"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    container_name: showtime-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb"]
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:4.1.0
    container_name: showtime-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST = apps on your machine (localhost:9092), DOCKER = containers (kafka:29092)
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    # No volume: topics are recreated by the services; local Kafka data is disposable.

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: showtime-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: showtime
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: showtime-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: showtime
      KC_DB_PASSWORD: showtime
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/showtime-realm.json:/opt/keycloak/data/import/showtime-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
